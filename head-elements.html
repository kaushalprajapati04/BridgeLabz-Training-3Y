<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Sets the title of the web page (shown in the browser tab) -->
    <title>Complete Head Elements Example</title>

    <!-- Declares the character encoding for proper text rendering -->
    <meta charset="UTF-8">

    <!-- Describes the content of the webpage for search engines -->
    <meta name="description" content="A webpage demonstrating all important HTML head elements.">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Your Name">

    <!-- Sets a base URL for all relative links on the page -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon or stylesheet -->
    <link rel="icon" href="favicon.ico">

    <!-- Internal CSS styles (empty for now) -->
    <style>
        /* Internal style block */
    </style>

    <!-- JavaScript code block (empty for now) -->
    <script>
        // JavaScript code can be added here
    </script>

</head>

<body>

    <h1>HTML &lt;head&gt; Elements Demonstration</h1>
    <p>This page demonstrates all major elements that can appear inside the head section.</p>

</body>
</html>
